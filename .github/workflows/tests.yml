name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Зависимостей нет, поэтому install не нужен: проверяем сразу.
      - name: Версия node
        run: node --version

      - name: Синтаксис браузерной половины
        run: node --check lib/client.js

      - name: Тесты
        run: node --test test/*.test.mjs
